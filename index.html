<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Doors Mobile FPS</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --panel: rgba(255,255,255,0.08);
      --ui: rgba(255,255,255,0.2);
      --text: #f3f3f3;
      --accent: #7ec7ff;
      --door: #8a5a2b;
      --doorShadow: #3a220d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
      overscroll-behavior: none;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    #title {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: clamp(18px, 3vw, 30px);
      letter-spacing: 2px;
      color: var(--text);
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }

    #roomLabel {
      position: absolute;
      left: 50%;
      top: 54px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: clamp(12px, 2vw, 16px);
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      border-radius: 999px;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }

    #message {
      position: absolute;
      left: 50%;
      bottom: 130px;
      transform: translateX(-50%);
      max-width: 78%;
      padding: 9px 14px;
      border-radius: 12px;
      text-align: center;
      line-height: 1.3;
      color: var(--text);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(2px);
      font-size: 12px;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      height: 125px;
      z-index: 30;
      pointer-events: none;
    }

    .pad {
      position: absolute;
      bottom: 0;
      width: 128px;
      height: 110px;
      pointer-events: auto;
    }

    .pad.left { left: 18px; }
    .pad.right { right: 18px; }

    .control-btn {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      touch-action: manipulation;
    }

    .control-btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.22);
    }

    #forward { left: 50%; top: 0; transform: translateX(-50%); }
    #backward { left: 50%; bottom: 0; transform: translateX(-50%); }
    #left { left: 0; top: 50%; transform: translateY(-50%); }
    #right { right: 0; top: 50%; transform: translateY(-50%); }

    @media (max-width: 430px) {
      #message {
        bottom: 138px;
        font-size: 11px;
      }

      .pad {
        width: 110px;
      }

      .control-btn {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div id="title">DOORS</div>
      <div id="roomLabel">Room 1</div>
      <div id="crosshair"></div>
      <div id="message">Drag to look around • move with touch buttons</div>
    </div>

    <div id="controls">
      <div class="pad left">
        <div class="control-btn" id="forward">▲</div>
        <div class="control-btn" id="backward">▼</div>
      </div>

      <div class="pad right">
        <div class="control-btn" id="left">◀</div>
        <div class="control-btn" id="right">▶</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const roomLabel = document.getElementById('roomLabel');
    const message = document.getElementById('message');

    const eventState = {
      pointerDown: false,
      lastX: 0,
      lastY: 0,
      activeTouch: null,
    };

    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false,
    };

    const player = {
      x: 0,
      y: 1.65,
      z: 0,
      yaw: 0,
      pitch: 0,
      speed: 2.3,
      radius: 0.45,
    };

    const roomData = [
      { name: 'Room 1', doorX: 0, doorZ: 5.2 },
      { name: 'Room 2', doorX: 0, doorZ: 5.2 },
      { name: 'Room 3', doorX: 0, doorZ: 5.2 },
    ];

    const walls = [
      { x: -8, z: -8, w: 16, d: 1 },
      { x: -8, z: 7, w: 16, d: 1 },
      { x: -8, z: -8, w: 1, d: 16 },
      { x: 7, z: -8, w: 1, d: 16 },

      { x: 0, z: -2, w: 1, d: 6 },
      { x: -2, z: 2, w: 5, d: 1 },
      { x: 3, z: 2, w: 1, d: 7 },
    ];

    const gameState = {
      roomIndex: 0,
      doorOpenProgress: 0,
      canInteract: false,
      interactMessage: 'Drag to look around • move with touch buttons',
      lastEPress: 0,
    };

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function collides(x, z) {
      for (const wall of walls) {
        const minX = wall.x - wall.w / 2;
        const maxX = wall.x + wall.w / 2;
        const minZ = wall.z - wall.d / 2;
        const maxZ = wall.z + wall.d / 2;

        if (x > minX - player.radius && x < maxX + player.radius &&
            z > minZ - player.radius && z < maxZ + player.radius) {
          return true;
        }
      }
      return false;
    }

    function movePlayer(dt) {
      let moveX = 0;
      let moveZ = 0;

      const forwardX = Math.cos(player.yaw);
      const forwardZ = Math.sin(player.yaw);
      const strafeX = Math.cos(player.yaw + Math.PI / 2);
      const strafeZ = Math.sin(player.yaw + Math.PI / 2);

      if (keys.forward) {
        moveX += forwardX;
        moveZ += forwardZ;
      }
      if (keys.backward) {
        moveX -= forwardX;
        moveZ -= forwardZ;
      }
      if (keys.left) {
        moveX -= strafeX;
        moveZ -= strafeZ;
      }
      if (keys.right) {
        moveX += strafeX;
        moveZ += strafeZ;
      }

      const len = Math.hypot(moveX, moveZ) || 1;
      const stepX = (moveX / len) * player.speed * dt;
      const stepZ = (moveZ / len) * player.speed * dt;

      const nextX = player.x + stepX;
      const nextZ = player.z + stepZ;

      if (!collides(nextX, player.z)) player.x = nextX;
      if (!collides(player.x, nextZ)) player.z = nextZ;

      player.x = clamp(player.x, -7.1, 7.1);
      player.z = clamp(player.z, -7.1, 7.1);
    }

    function checkDoorInteraction() {
      const room = roomData[gameState.roomIndex];
      const dist = Math.hypot(player.x - room.doorX, player.z - room.doorZ);
      const inRange = dist < 1.15;

      gameState.canInteract = inRange;

      if (inRange) {
        message.textContent = 'Tap E or press E to open the door';
      } else {
        message.textContent = 'Drag to look around • move with touch buttons';
      }
    }

    function openDoor() {
      if (!gameState.canInteract) return;

      const now = performance.now();
      if (now - gameState.lastEPress < 350) return;
      gameState.lastEPress = now;

      gameState.roomIndex = (gameState.roomIndex + 1) % roomData.length;
      player.x = 0;
      player.z = 0;
      player.yaw = 0;
      roomLabel.textContent = `Room ${gameState.roomIndex + 1}`;
      message.textContent = `Entered ${roomData[gameState.roomIndex].name}`;
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
      sky.addColorStop(0, '#7bb8e8');
      sky.addColorStop(1, '#dfefff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function drawFloor() {
      const floor = ctx.createLinearGradient(0, window.innerHeight * 0.45, 0, window.innerHeight);
      floor.addColorStop(0, '#444');
      floor.addColorStop(1, '#222');
      ctx.fillStyle = floor;
      ctx.fillRect(0, window.innerHeight * 0.46, window.innerWidth, window.innerHeight * 0.54);
    }

    function drawWorld() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const fov = Math.PI / 3;
      const rayCount = 160;

      for (let i = 0; i < rayCount; i++) {
        const ray = player.yaw - fov / 2 + (i / rayCount) * fov;
        let distance = 0;
        let hit = false;

        while (distance < 18 && !hit) {
          const testX = player.x + Math.cos(ray) * distance;
          const testZ = player.z + Math.sin(ray) * distance;

          for (const wall of walls) {
            const minX = wall.x - wall.w / 2;
            const maxX = wall.x + wall.w / 2;
            const minZ = wall.z - wall.d / 2;
            const maxZ = wall.z + wall.d / 2;

            if (testX > minX && testX < maxX && testZ > minZ && testZ < maxZ) {
              hit = true;
              break;
            }
          }

          distance += 0.08;
        }

        if (!hit) distance = 18;

        const wallHeight = clamp((h / distance) * 1.6, 30, h * 0.9);
        const x = (i / rayCount) * w;
        const width = (w / rayCount) + 1;
        const brightness = 1 - clamp(distance / 18, 0, 1);
        const gray = 90 + brightness * 120;

        ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
        ctx.fillRect(x, (h - wallHeight) / 2, width, wallHeight);

        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(x, (h + wallHeight) / 2, width, h - (h + wallHeight) / 2);

        ctx.fillStyle = '#7eaed7';
        ctx.fillRect(x, 0, width, (h - wallHeight) / 2);
      }
    }

    function drawDoor() {
      const room = roomData[gameState.roomIndex];
      const dx = room.doorX - player.x;
      const dz = room.doorZ - player.z;
      const dist = Math.hypot(dx, dz);
      const angleToDoor = Math.atan2(dz, dx) - player.yaw;

      if (Math.abs(angleToDoor) < 1.4 && dist < 8) {
        const size = clamp((window.innerHeight / dist) * 1.8, 40, 220);
        const doorW = size * 0.72;
        const doorH = size * 1.4;
        const screenX = window.innerWidth / 2 + Math.tan(angleToDoor) * 260;
        const screenY = window.innerHeight / 2 + 24;

        ctx.fillStyle = '#8a5a2b';
        ctx.fillRect(screenX - doorW / 2, screenY - doorH / 2, doorW, doorH);

        ctx.strokeStyle = '#3b220d';
        ctx.lineWidth = 3;
        ctx.strokeRect(screenX - doorW / 2, screenY - doorH / 2, doorW, doorH);

        ctx.fillStyle = '#d9c7a1';
        ctx.fillRect(screenX - doorW * 0.12, screenY - doorH * 0.28, doorW * 0.24, doorH * 0.56);
      }
    }

    function render() {
      drawSky();
      drawFloor();
      drawWorld();
      drawDoor();
    }

    let lastTime = 0;
    function loop(ts) {
      const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.05);
      lastTime = ts;

      movePlayer(dt);
      checkDoorInteraction();
      render();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();

      if (key === 'w' || key === 'arrowup') keys.forward = true;
      if (key === 's' || key === 'arrowdown') keys.backward = true;
      if (key === 'a' || key === 'arrowleft') keys.left = true;
      if (key === 'd' || key === 'arrowright') keys.right = true;
      if (key === 'e') openDoor();
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();

      if (key === 'w' || key === 'arrowup') keys.forward = false;
      if (key === 's' || key === 'arrowdown') keys.backward = false;
      if (key === 'a' || key === 'arrowleft') keys.left = false;
      if (key === 'd' || key === 'arrowright') keys.right = false;
    });

    function bindMovementButton(buttonId, moveKey) {
      const btn = document.getElementById(buttonId);
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        keys[moveKey] = true;
      });
      btn.addEventListener('pointerup', () => { keys[moveKey] = false; });
      btn.addEventListener('pointerleave', () => { keys[moveKey] = false; });
      btn.addEventListener('pointercancel', () => { keys[moveKey] = false; });
    }

    bindMovementButton('forward', 'forward');
    bindMovementButton('backward', 'backward');
    bindMovementButton('left', 'left');
    bindMovementButton('right', 'right');

    function onPointerDown(e) {
      eventState.pointerDown = true;
      eventState.lastX = e.clientX;
      eventState.lastY = e.clientY;
      canvas.classList.add('dragging');
    }

    function onPointerMove(e) {
      if (!eventState.pointerDown) return;

      const dx = e.clientX - eventState.lastX;
      const dy = e.clientY - eventState.lastY;

      player.yaw -= dx * 0.005;
      player.pitch -= dy * 0.004;
      player.pitch = clamp(player.pitch, -1.1, 1.1);

      eventState.lastX = e.clientX;
      eventState.lastY = e.clientY;
    }

    function onPointerUp() {
      eventState.pointerDown = false;
      canvas.classList.remove('dragging');
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('.control-btn')) return;
      const touch = e.touches[0];
      eventState.pointerDown = true;
      eventState.lastX = touch.clientX;
      eventState.lastY = touch.clientY;
      canvas.classList.add('dragging');
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!eventState.pointerDown) return;
      const touch = e.touches[0];
      const dx = touch.clientX - eventState.lastX;
      const dy = touch.clientY - eventState.lastY;

      player.yaw -= dx * 0.005;
      player.pitch -= dy * 0.004;
      player.pitch = clamp(player.pitch, -1.1, 1.1);

      eventState.lastX = touch.clientX;
      eventState.lastY = touch.clientY;
    }, { passive: true });

    window.addEventListener('touchend', onPointerUp, { passive: true });
    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();
    roomLabel.textContent = 'Room 1';
    requestAnimationFrame(loop);
  </script>
</body>
</html>
